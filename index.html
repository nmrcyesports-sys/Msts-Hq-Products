<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSTS RailHub - Premium Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card-3d-wrap { perspective: 1000px; }
        .card-3d { transition: transform 0.4s ease, box-shadow 0.4s ease; transform-style: preserve-3d; }
        .card-3d:hover { transform: translateY(-10px) rotateX(5deg) rotateY(-5deg); box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-animate { animation: slideIn 0.3s ease forwards; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; width: 20px; height: 20px; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col relative overflow-x-hidden">

    <div id="toastContainer" class="fixed top-20 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- NAVBAR -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md bg-opacity-90 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-train-subway text-2xl text-amber-500"></i>
                <span class="text-xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">MSTS RailHub</span>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="toggleModal('cartModal')" class="relative p-2 text-slate-300 hover:text-amber-400">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-amber-500 text-black text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </button>
                <button id="navLoginBtn" onclick="toggleModal('loginModal')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2 rounded-lg">
                    <i class="fa-solid fa-user mr-2"></i>Login
                </button>
            </div>
        </div>
    </nav>

    <!-- PRODUCTS SECTION -->
    <main class="max-w-7xl mx-auto px-4 py-12 flex-grow w-full">
        <h2 class="text-3xl font-bold border-l-4 border-amber-500 pl-4 mb-10">Featured Assets</h2>
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 card-3d-wrap">
            <!-- Injected via JS -->
        </div>
    </main>

    <!-- LOGIN MODAL -->
    <div id="loginModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md p-8 relative">
            <button onclick="toggleModal('loginModal')" class="absolute top-5 right-5 text-slate-500 hover:text-white"><i class="fa-solid fa-xmark text-2xl"></i></button>
            
            <div class="flex border-b border-slate-800 mb-8">
                <button id="custTab" onclick="switchTab('customer')" class="flex-1 pb-4 text-center font-bold text-amber-400 border-b-2 border-amber-400">Customer</button>
                <button id="adminTab" onclick="switchTab('admin')" class="flex-1 pb-4 text-center font-bold text-slate-500 border-b-2 border-transparent">Admin</button>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-5">
                <input type="hidden" id="roleType" value="customer">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Username / ID</label>
                    <input type="text" id="username" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-100 focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Password</label>
                    <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-100 focus:border-amber-500">
                </div>
                <button type="submit" id="authBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-lg">Login</button>
            </form>
            
            <!-- Quick Test Credentials Note -->
            <p class="text-xs text-slate-500 mt-4 text-center">Try Customer: lucky@gmail.com / password123<br>Try Admin: admin1 / supersecret</p>
        </div>
    </div>

    <!-- CART MODAL -->
    <div id="cartModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg p-6 relative flex flex-col max-h-[90vh]">
            <button onclick="toggleModal('cartModal')" class="absolute top-5 right-5 text-slate-500 hover:text-white"><i class="fa-solid fa-xmark text-2xl"></i></button>
            <h3 class="text-2xl font-bold mb-6 border-b border-slate-800 pb-4"><i class="fa-solid fa-bag-shopping text-amber-500 mr-3"></i> Your Cart</h3>
            <div id="cartItems" class="space-y-3 mb-6 overflow-y-auto flex-grow"></div>
            
            <div id="checkoutSection" class="mt-auto pt-4 border-t border-slate-800">
                <div class="flex justify-between font-extrabold text-xl mb-6">
                    <span>Total Amount:</span><span id="cartTotal" class="text-amber-400">₹0</span>
                </div>
                <button id="payBtn" onclick="processPayment()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-4 rounded-xl text-lg">Pay Securely & Download</button>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, title: 'WAP-7 High Definition Pack', desc: 'Ultra-detailed 3D cab view, custom traction sounds.', price: 299, icon: 'fa-train' },
            { id: 2, title: 'LHB Rajdhani Complete Coach Set', desc: 'Includes 1AC, 2AC, 3AC, Generator Van.', price: 399, icon: 'fa-train-subway' },
            { id: 3, title: 'Western Railways V12 Mega Route', desc: 'Over 1,500 km of trackwork and custom stations.', price: 599, icon: 'fa-route' }
        ];

        let cart = [];
        let isLoggedIn = false;
        let cartTotalValue = 0;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('productGrid').innerHTML = products.map(p => `
                <div class="card-3d bg-slate-900 border border-slate-700 rounded-2xl overflow-hidden flex flex-col group">
                    <div class="h-48 bg-slate-950 flex items-center justify-center"><i class="fa-solid ${p.icon} text-7xl text-slate-800"></i></div>
                    <div class="p-6 flex-grow">
                        <h3 class="text-xl font-bold text-slate-100 mb-2">${p.title}</h3>
                        <p class="text-slate-400 text-sm">${p.desc}</p>
                    </div>
                    <div class="p-6 pt-0 flex justify-between items-center">
                        <span class="text-2xl font-black text-amber-500">₹${p.price}</span>
                        <button onclick="addToCart(${p.id})" class="bg-slate-800 text-slate-300 px-5 py-2 rounded-lg"><i class="fa-solid fa-plus mr-1"></i> Add</button>
                    </div>
                </div>
            `).join('');
            updateCartUI();
        });

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icon = type === 'success' ? 'fa-circle-check text-green-400' : 'fa-circle-xmark text-red-400';
            toast.className = `toast-animate bg-slate-800 border border-slate-600 text-white px-6 py-4 rounded shadow-xl mb-2 flex items-center space-x-3`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        function switchTab(role) {
            document.getElementById('roleType').value = role;
            document.getElementById('custTab').className = `flex-1 pb-4 text-center font-bold ${role === 'customer' ? 'text-amber-400 border-b-2 border-amber-400' : 'text-slate-500 border-b-2 border-transparent'}`;
            document.getElementById('adminTab').className = `flex-1 pb-4 text-center font-bold ${role === 'admin' ? 'text-amber-400 border-b-2 border-amber-400' : 'text-slate-500 border-b-2 border-transparent'}`;
            document.getElementById('authBtn').className = `w-full font-bold py-3 rounded-lg ${role === 'admin' ? 'bg-red-600 text-white hover:bg-red-500' : 'bg-amber-500 text-slate-950 hover:bg-amber-400'}`;
        }

        function addToCart(id) {
            cart.push(products.find(p => p.id === id));
            updateCartUI();
            showToast('Added to cart');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            cartTotalValue = cart.reduce((sum, item) => sum + item.price, 0);
            
            if (cart.length === 0) {
                document.getElementById('cartItems').innerHTML = `<p class="text-center text-slate-500 mt-10">Cart is empty</p>`;
                document.getElementById('checkoutSection').style.display = 'none';
            } else {
                document.getElementById('checkoutSection').style.display = 'block';
                document.getElementById('cartTotal').innerText = `₹${cartTotalValue}`;
                document.getElementById('cartItems').innerHTML = cart.map((item, i) => `
                    <div class="flex justify-between items-center bg-slate-950 p-3 rounded border border-slate-800">
                        <span>${item.title}</span>
                        <div class="flex items-center"><span class="text-amber-500 font-bold mr-4">₹${item.price}</span><i onclick="removeFromCart(${i})" class="fa-solid fa-trash text-red-500 cursor-pointer"></i></div>
                    </div>`).join('');
            }
        }

        // FULL-STACK CONNECTION: Sending login data to the Node.js backend
        async function handleAuth(e) {
            e.preventDefault();
            const btn = document.getElementById('authBtn');
            btn.innerHTML = `<span class="spinner"></span>`;
            
            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                requestedRole: document.getElementById('roleType').value
            };

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.ok) {
                    isLoggedIn = true;
                    toggleModal('loginModal');
                    document.getElementById('navLoginBtn').innerHTML = `<i class="fa-solid fa-user-check mr-2 text-amber-500"></i>${data.role.toUpperCase()}`;
                    showToast(data.message);
                } else {
                    showToast(data.message, 'error');
                }
            } catch (err) {
                showToast("Server connection failed.", "error");
            }
            btn.innerHTML = 'Login';
        }

        // FULL-STACK CONNECTION: Sending payment request to the Node.js backend
        async function processPayment() {
            if (!isLoggedIn) return showToast('Please login first', 'error');

            const btn = document.getElementById('payBtn');
            btn.innerHTML = `<span class="spinner mr-2"></span> Connecting to Paytm...`;
            
            try {
                const response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: cartTotalValue, items: cart })
                });
                const data = await response.json();

                if (response.ok) {
                    btn.innerHTML = `<i class="fa-solid fa-check-double mr-2"></i> Payment Successful`;
                    btn.className = "w-full bg-green-500 text-white font-extrabold py-4 rounded-xl text-lg";
                    
                    setTimeout(() => {
                        cart = [];
                        updateCartUI();
                        toggleModal('cartModal');
                        btn.innerHTML = `Pay Securely & Download`;
                        btn.className = "w-full bg-amber-500 text-slate-950 font-extrabold py-4 rounded-xl text-lg";
                        showToast(`TXN: ${data.transactionId} - Files downloading!`, 'success');
                    }, 2000);
                }
            } catch (err) {
                showToast("Payment processing failed.", "error");
                btn.innerHTML = `Pay Securely & Download`;
            }
        }
    </script>
</body>
</html>
